name: thinking_recovery
title: Thinking Recovery
description: >
  Captures partial reasoning and response streams while the model generates and,
  when an attempt dies (error, timeout, stop, hang, or restart), re-injects a
  compact digest of that unfinished work into the next attempt so the agent
  continues instead of reasoning from zero. Saves output tokens and time while
  keeping context append-only and prompt-cache friendly.
version: 1.1.0
settings_sections:
  - agent
per_project_config: false
per_agent_config: false
